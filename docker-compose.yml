version: '3'

services:

  amines_backend:
    image: 'descriptor-backend:latest'
    environment:
      POSTGRES_SERVER: descriptor_database
      POSTGRES_USER: postgres
      POSTGRES_PASSWD: "${POSTGRES_PASSWD:?is not set, expected from ../.env.secrets via the .env link in this folder}"
      POSTGRES_DB: combined_amines_data
      API_PREFIX: amines
    entrypoint: bash prestart.sh
    networks:
      - external_network
      - descriptor-libraries-internal
    labels:
      - traefik.enable=true
      - traefik.http.services.descriptor_libraries-amines_backend.loadbalancer.server.port=8080
      - "traefik.http.routers.descriptor_libraries-amines_backend.rule=(Host(`descriptor-libraries.molssi.org`) && PathPrefix(`/api/amines`))"
      - traefik.http.routers.descriptor_libraries-amines_backend.entrypoints=websecure
      - traefik.http.routers.descriptor_libraries-amines_backend.tls.certresolver=letsencrypt

  amines_frontend:
    image: 'descriptor-frontend-alpine:latest'
    volumes:
      - "./public:/app/public"
    environment:
      - VITE_BASE_URL=/amines
    networks:
      - external_network
    entrypoint: ash renameBase.sh
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.descriptor_libraries-frontend-amines.rule=(Host(`descriptor-libraries.molssi.org`) && PathPrefix(`/amines`))"
      - "traefik.http.services.descriptor_libraries-frontend-amines.loadbalancer.server.port=3000"
      - traefik.http.routers.descriptor_libraries-frontend-amines.entrypoints=websecure
      - traefik.http.routers.descriptor_libraries-frontend-amines.tls.certresolver=letsencrypt

networks:
  external_network:
    # external = handled outside of this docker compose
    name: docker_main_net
    external: true
  descriptor-libraries-internal:
    external: true
